<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanji Builder</title>
  <link rel="stylesheet" href="style.css?v=0.21" />
  <script src="translations.js?v=0.12"></script>
  <script src="NewLearn/data/ready.js?v=0.10"></script>
  <script defer src="script.js?v=0.23"></script>
</head>
<body data-page="learn">
  <header class="navbar">
    <nav>
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="create.html" data-i18n="nav.create">Create</a>
      <a href="draw.html" data-i18n="nav.draw">Draw</a>
      <a href="dictionary.html" data-i18n="nav.dictionary">Dictionary</a>
      <a href="kanji.html" data-i18n="nav.kanji">Kanji</a>
      <a href="web.html" data-i18n="nav.web">Web</a>
      <a href="write.html" data-i18n="nav.write">Write</a>
      <a href="play.html" data-i18n="nav.play">Play</a>
      <a href="learn.html" class="active" data-i18n="nav.learn">Learn</a>
      <a href="comments.html" data-i18n="nav.comments">Comments</a>
      <a href="transfers.html" data-i18n="nav.transfers">Transfers</a>
    </nav>
    <div class="navbar-right">
      <div class="lang-wrapper">
        <button type="button" id="lang-btn">English</button>
        <div id="lang-dropdown" class="lang-dropdown hidden">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="es">Español</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="pt">Português</button>
          <button type="button" data-lang="ru">Русский</button>
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="ko">한국어</button>
          <button type="button" data-lang="de">Deutsch</button>
          <button type="button" data-lang="fr">Français</button>
          <button type="button" data-lang="it">Italiano</button>
        </div>
      </div>
      <button id="theme-toggle">🌙</button>
    </div>
  </header>

  <main>
    <span class="app-version">v0.7b</span>
    <h1 data-i18n="nav.learn">Learn</h1>
    <section class="learn-chart-section">
      <div class="learn-chart-wrap">
        <table class="learn-chart" id="learn-chart">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <aside id="learn-plan" class="learn-plan">
        <h2 data-i18n="learn.planTitle">Lesson plan</h2>
        <p id="learn-plan-empty" class="learn-plan-empty" data-i18n="learn.planEmpty">Right-click a box to add it.</p>
        <ul id="learn-plan-list" class="learn-plan-list"></ul>
        <p id="learn-plan-note" class="learn-plan-note" hidden></p>
        <button type="button" id="learn-plan-start" class="transfer-lang-chip learn-plan-start" hidden data-i18n="learn.planStart">Start</button>
      </aside>
      <p class="learn-chart-note" data-i18n="learn.chartNote">Left-click a box to browse its letters, words, or sentences. Right-click a box to add it to the lesson plan. Hold right-click to see its stats.</p>
    </section>
  </main>
</body>
</html>
