<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanji Builder</title>
  <link rel="stylesheet" href="style.css?v=0.21" />
  <script src="translations.js?v=0.14"></script>
  <script src="NewLearn/data/ready.js?v=0.10"></script>
  <script defer src="script.js?v=0.23"></script>
</head>
<body data-page="learn-vocab">
  <header class="navbar">
    <nav>
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="create.html" data-i18n="nav.create">Create</a>
      <a href="draw.html" data-i18n="nav.draw">Draw</a>
      <a href="dictionary.html" data-i18n="nav.dictionary">Dictionary</a>
      <a href="kanji.html" data-i18n="nav.kanji">Kanji</a>
      <a href="web.html" data-i18n="nav.web">Web</a>
      <a href="write.html" data-i18n="nav.write">Write</a>
      <a href="play.html" data-i18n="nav.play">Play</a>
      <a href="learn.html" class="active" data-i18n="nav.learn">Learn</a>
      <a href="comments.html" data-i18n="nav.comments">Comments</a>
      <a href="transfers.html" data-i18n="nav.transfers">Transfers</a>
    </nav>
    <div class="navbar-right">
      <div class="lang-wrapper">
        <button type="button" id="lang-btn">English</button>
        <div id="lang-dropdown" class="lang-dropdown hidden">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="es">Español</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="pt">Português</button>
          <button type="button" data-lang="ru">Русский</button>
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="ko">한국어</button>
          <button type="button" data-lang="de">Deutsch</button>
          <button type="button" data-lang="fr">Français</button>
          <button type="button" data-lang="it">Italiano</button>
        </div>
      </div>
      <button id="theme-toggle">🌙</button>
    </div>
  </header>

  <main>
    <span class="app-version">v0.7b</span>
    <div class="kanji-learn-bar">
      <div class="kanji-learn-actions">
        <a href="learn.html" class="transfer-lang-chip" data-i18n="learn.backToLearn">← Back to Learn</a>
        <button type="button" id="vocab-learn-sidebar-toggle" class="transfer-lang-chip kanji-learn-icon-btn" aria-controls="vocab-learn-sidebar" aria-expanded="true" data-i18n-title="kanji.toggleLessons" title="Show or hide lessons" aria-label="Show or hide lessons">☰</button>
        <h1 id="vocab-learn-title" class="vocab-learn-title">Vocabulary</h1>
      </div>
      <div class="kanji-learn-actions">
        <button type="button" id="vocab-learn-edit" class="transfer-lang-chip hidden">Edit</button>
        <button type="button" id="vocab-learn-save" class="transfer-lang-chip" data-i18n="kanji.save">Save</button>
        <button type="button" id="vocab-learn-settings" class="transfer-lang-chip kanji-learn-icon-btn" data-i18n-title="kanji.settings" title="Settings" aria-label="Settings" aria-controls="vocab-learn-settings-panel" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
        <div id="vocab-learn-settings-panel" class="kanji-learn-settings-panel hidden">
          <div class="kanji-learn-settings-row">
            <span data-i18n="kanji.learnStyle">Learn Style</span>
            <button type="button" id="vocab-learn-style" class="transfer-lang-chip kanji-learn-style">Linear</button>
          </div>
          <div class="kanji-learn-settings-row" data-learn-style="exponential">
            <label for="vocab-learn-positive-jump" data-i18n="kanji.positiveJump">Positive Jump</label>
            <input type="number" id="vocab-learn-positive-jump" data-exp="positiveJump" min="0" max="100000" step="1" />
          </div>
          <div class="kanji-learn-settings-row" data-learn-style="exponential">
            <label for="vocab-learn-negative-jump" data-i18n="kanji.negativeJump">Negative Jump</label>
            <input type="number" id="vocab-learn-negative-jump" data-exp="negativeJump" min="0" max="100000" step="1" />
          </div>
          <div class="kanji-learn-settings-row">
            <label for="vocab-learn-golden-streak" data-i18n="kanji.goldenStreak">Golden Streak</label>
            <input type="number" id="vocab-learn-golden-streak" min="1" max="100000" step="1" />
          </div>
          <div class="kanji-learn-settings-row">
            <label for="vocab-learn-mode-definition" data-i18n="kanji.definitionMode">Definition mode (o / x)</label>
            <input type="checkbox" id="vocab-learn-mode-definition" data-mode="definition" />
          </div>
          <div class="kanji-learn-settings-row">
            <label for="vocab-learn-mode-word" data-i18n="learn.wordMode">Word mode (type the word)</label>
            <input type="checkbox" id="vocab-learn-mode-word" data-mode="word" />
          </div>
          <div class="kanji-learn-settings-row" id="vocab-learn-reading-row">
            <label for="vocab-learn-mode-reading" data-i18n="kanji.readingMode">Reading mode (type reading)</label>
            <input type="checkbox" id="vocab-learn-mode-reading" data-mode="reading" />
          </div>
          <div class="kanji-learn-settings-row" id="vocab-learn-hints-row">
            <label for="vocab-learn-hints" data-i18n="learn.hints">Hints (show the reading or meaning)</label>
            <input type="checkbox" id="vocab-learn-hints" />
          </div>
          <div class="kanji-learn-settings-row">
            <label for="vocab-learn-origins" data-i18n="learn.viewOrigins">View Origins</label>
            <input type="checkbox" id="vocab-learn-origins" checked />
          </div>
          <div class="kanji-learn-settings-row">
            <span data-i18n="learn.oxKeybinds">O/X Keybinds</span>
            <button type="button" id="vocab-learn-ox-keybinds" class="transfer-lang-chip kanji-learn-icon-btn" data-i18n-title="learn.oxKeybinds" title="O/X Keybinds" aria-label="O/X Keybinds" aria-controls="vocab-ox-keybind-dialog" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            </button>
          </div>
          <button type="button" id="vocab-learn-reset-counts" class="transfer-lang-chip kanji-learn-reset" data-i18n="kanji.resetCounts">Reset Counts</button>
        </div>
      </div>
    </div>
    <div class="kanji-learn-layout">
      <aside id="vocab-learn-sidebar" class="kanji-learn-sidebar">
        <button type="button" id="vocab-learn-filter" class="transfer-lang-chip kanji-learn-filter" aria-pressed="false">To-Do</button>
        <ol id="vocab-learn-lessons" class="kanji-learn-lessons"></ol>
      </aside>
      <div class="kanji-learn-main">
        <section id="vocab-learn-body" class="kanji-learn-body"></section>
        <section id="vocab-learn-editor" class="learn-edit-box hidden" aria-label="Edit">
          <div class="learn-edit-grid">
            <label id="vocab-learn-editor-word-label">Word
              <textarea id="vocab-learn-editor-word" rows="2"></textarea>
            </label>
            <label id="vocab-learn-editor-meaning-label">Translation
              <textarea id="vocab-learn-editor-meaning" rows="2"></textarea>
            </label>
          </div>
          <div class="learn-edit-actions">
            <button type="button" id="vocab-learn-editor-save" class="transfer-lang-chip">Save</button>
            <button type="button" id="vocab-learn-editor-close" class="transfer-lang-chip">Close</button>
          </div>
        </section>
        <section id="vocab-learn-notes" class="learn-notes-panel is-open" aria-label="Notes">
          <div class="learn-notes-head">
            <h2 class="learn-notes-title">Notes</h2>
            <button type="button" id="vocab-learn-notes-toggle" class="transfer-lang-chip kanji-learn-icon-btn is-active" aria-controls="vocab-learn-notes-body" aria-pressed="true" title="Show or hide notes" aria-label="Show or hide notes">👁</button>
          </div>
          <div id="vocab-learn-notes-body" class="learn-notes-body">
            <div id="vocab-learn-notes-list" class="afic-note-list"></div>
            <textarea id="vocab-learn-notes-input" class="afic-note-input" rows="3" placeholder="Write a note for this card…"></textarea>
            <button type="button" id="vocab-learn-notes-post" class="transfer-lang-chip">Post</button>
          </div>
        </section>
      </div>
    </div>
    <div id="vocab-learn-loading" class="dictionary-loading learn-load-screen hidden" role="status" aria-live="polite" aria-busy="false">
      <div class="dictionary-loading-card">
        <p id="vocab-learn-loading-label" class="dictionary-loading-label"></p>
        <div class="dictionary-loading-track" aria-hidden="true">
          <div id="vocab-learn-loading-bar" class="dictionary-loading-bar"></div>
        </div>
        <p id="vocab-learn-loading-percent" class="dictionary-loading-percent">0%</p>
        <p id="vocab-learn-loading-note" class="learn-plan-note hidden"></p>
      </div>
    </div>
    <div id="vocab-ox-keybind-dialog" class="ox-keybind-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="vocab-ox-keybind-title">
      <div class="ox-keybind-card">
        <div class="ox-keybind-head">
          <h2 id="vocab-ox-keybind-title" class="ox-keybind-title" data-i18n="learn.oxKeybindDefault">Default</h2>
          <button type="button" id="vocab-ox-keybind-save" class="transfer-lang-chip ox-keybind-save" data-i18n="kanji.save">Save</button>
        </div>
        <div id="vocab-ox-keybind-list"></div>
        <button type="button" id="vocab-ox-keybind-reset" class="transfer-lang-chip ox-keybind-reset" data-i18n="learn.oxKeybindReset">Reset Keybinds</button>
      </div>
    </div>
    <div id="vocab-learn-peek" class="kanji-peek kanji-learn-peek hidden" aria-hidden="true"></div>
  </main>
</body>
</html>
